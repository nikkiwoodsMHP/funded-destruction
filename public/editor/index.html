<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editorial Review | Funded Destruction</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f2ea;color:#12231e;margin:0}header{background:#12231e;color:white;padding:20px 6vw}main{max-width:980px;margin:30px auto;padding:0 18px}button,select,textarea{font:inherit;padding:8px}button{cursor:pointer;border:1px solid #274535;border-radius:6px;background:#244d3e;color:white}textarea{width:100%;min-height:72px;box-sizing:border-box}article{background:white;border:1px solid #d6ded5;padding:20px;margin:18px 0;border-radius:10px;overflow-wrap:anywhere}.meta{color:#526358;font-size:14px}label{display:block;margin:10px 0}pre{white-space:pre-wrap}a{color:#075f41}</style></head>
<body><header><strong>FUNDED DESTRUCTION / PRIVATE EDITORIAL DESK</strong></header><main><h1>Report review</h1><p>Only authorized editors with a verified Cloudflare Access session may view or update submissions. Reporter information must not be republished without verification and appropriate consent.</p>
<label>Review queue <select id="filter"><option>new</option><option>screening</option><option>verifying</option><option>investigating</option><option>closed</option></select></label>
<button id="refresh">Load reports</button><p role="status" id="status"></p><div id="list"></div></main>
<script>
const state=document.getElementById('status'),list=document.getElementById('list'),filter=document.getElementById('filter');
function node(tag,value,cls){const e=document.createElement(tag);if(value!==undefined)e.textContent=value;if(cls)e.className=cls;return e;}
async function load(){state.textContent='Loading…';list.replaceChildren();try{const r=await fetch('/api/editor/reports?status='+encodeURIComponent(filter.value),{credentials:'same-origin'});if(!r.ok)throw Error('Access denied or backend unavailable ('+r.status+').');const data=await r.json();state.textContent=(data.reports||[]).length+' report(s)';for(const item of data.reports||[]){const card=node('article');card.append(node('h2',item.category),node('p',item.general_location+' • '+(item.incident_period||'Date unknown'),'meta'),node('p',item.description),node('p','Submitted '+item.submitted_at,'meta'));if(item.public_source_url){const a=node('a','Submitted public source');a.href=item.public_source_url;a.target='_blank';a.rel='noopener noreferrer';card.append(a);}const label=node('label','Status '),sel=node('select');for(const option of ['new','screening','verifying','investigating','closed']){const opt=node('option',option);opt.value=option;sel.append(opt);}sel.value=item.status;label.append(sel);const notes=node('textarea');notes.value=item.review_notes||'';notes.maxLength=4000;notes.setAttribute('aria-label','Internal editorial notes');const save=node('button','Save review');save.onclick=async()=>{save.disabled=true;try{const r=await fetch('/api/editor/reports/'+encodeURIComponent(item.id),{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:sel.value,notes:notes.value})});if(!r.ok)throw Error('Save failed ('+r.status+')');state.textContent='Saved review';await load();}catch(e){state.textContent=e.message;}finally{save.disabled=false;}};card.append(label,notes,save);list.append(card);}}catch(e){state.textContent=e.message;}}
document.getElementById('refresh').onclick=load;filter.onchange=load;load();
</script></body></html>
